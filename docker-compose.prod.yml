services:
  backend:
    build:
      context: ./backend
    container_name: srrt-backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "host"
    volumes:
      - ./backend/data/GeoLite2-ASN.mmdb:/app/data/GeoLite2-ASN.mmdb
      - ./backend/data/GeoLite2-City.mmdb:/app/data/GeoLite2-City.mmdb
    environment:
      - LOCAL_COUNTRY=TW
      - NETWORK_INTERFACE=ens4 # GCP 預設網卡
      - ASN_DB_PATH=/app/data/GeoLite2-ASN.mmdb
      - GEOIP_DB_PATH=/app/data/GeoLite2-City.mmdb
      - RULES_PATH=/app/data/apps.json
      - GIN_MODE=release
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: srrt-frontend
    network_mode: "host"
    depends_on:
      - backend
    environment:
      - NGINX_PORT=80
      - NGINX_HOST=_
      - BACKEND_ADDR=127.0.0.1:8080
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
