# 強制跳轉 HTTPS
server {
    listen ${NGINX_PORT};
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dns.zeroflare.tw;

    ssl_certificate     /etc/letsencrypt/live/dns.zeroflare.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.zeroflare.tw/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /locales/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Proxy for DNS Stream
    location /ws {
        proxy_pass http://${BACKEND_ADDR}/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout settings for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API Proxy for Traceroute & other tools
    location /api {
        proxy_pass http://${BACKEND_ADDR}/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
