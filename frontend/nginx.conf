# Nginx Configuration Template
# This file is used by envsubst to generate the final config at /etc/nginx/conf.d/default.conf

server {
    listen ${NGINX_PORT};
    server_name ${NGINX_HOST};

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Proxy for DNS Stream
    location /ws {
        proxy_pass http://${BACKEND_ADDR}/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout settings for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API Proxy for Traceroute & other tools
    location /api {
        proxy_pass http://${BACKEND_ADDR}/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

